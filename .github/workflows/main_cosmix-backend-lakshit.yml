# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
#
# More GitHub Actions for Azure:
# https://github.com/Azure/actions
#
# More info for Python + Azure App Service:
# https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - cosmix-backend-lakshit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Validate that the backend dependencies can be installed.
      # We do NOT deploy this virtual environment.
      - name: Validate backend dependencies
        working-directory: backend
        run: |
          python -m venv ../antenv
          source ../antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Package ONLY the backend.
      # This makes /home/site/wwwroot contain:
      #
      # app/
      # requirements.txt
      # model files
      # etc.
      #
      # Therefore Azure can correctly use:
      # app.main:app
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/
            !backend/__pycache__/
            !backend/**/__pycache__/
            !backend/.pytest_cache/
            !backend/**/.pytest_cache/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6CFC47834B2744189D746023AAF0EB7A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4F6B968B844943BF80028A2D96B8F948 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9FD099BA291F43AB856AE7EF4883AB17 }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "cosmix-backend-lakshit"
          slot-name: "Production"
          package: ./backend